<head>

<style>
:root{--bg:#090a0e;--panel:#121319;--gold:#d8bd83;--muted:#a7a4a0;--line:rgba(216,189,131,.25);--white:#f7f3eb}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;color:var(--white);font-family:'DM Sans',sans-serif;background:radial-gradient(ellipse at 50% -15%,#29251f 0%,#111116 36%,#090a0e 72%);min-height:100vh}
.page{max-width:1600px;margin:auto;padding:clamp(24px,5vw,72px) clamp(16px,3vw,48px) 40px}

.card{position:relative;min-width:0;padding:10px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.018) 45%,rgba(216,189,131,.045));box-shadow:0 24px 70px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(18px);transition:transform .35s ease,border-color .35s ease,box-shadow .35s ease}

.cardhead{display:flex;align-items:center;gap:9px;padding:8px 5px 14px;min-height:48px}
.number{font-size:10px;letter-spacing:.12em;color:var(--gold);border:1px solid var(--line);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;flex:0 0 auto}
.card h2{font:500 14px/1.3 'Playfair Display',Georgia,serif;color:var(--white);margin:0}
.screen{overflow:hidden;position:relative;border-radius:13px;background:#f7f0e7;border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 30px rgba(0,0,0,.3)}

.cardfoot{display:flex;justify-content:space-between;align-items:center;padding:14px 5px 5px;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.status{width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 9px var(--gold);display:inline-block;margin-right:7px}
.contact-cta{text-align:center;margin:clamp(44px,7vw,88px) auto 12px;padding:clamp(28px,4vw,48px) 20px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,rgba(216,189,131,.11),rgba(255,255,255,.025) 55%,rgba(216,189,131,.06));box-shadow:0 18px 55px rgba(0,0,0,.25);max-width:900px}
.contact-cta p{font:500 clamp(26px,3.5vw,42px)/1.2 'Playfair Display',Georgia,serif;margin:0 0 20px;color:var(--white)}
.contact-cta a{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 25px;border:1px solid rgba(216,189,131,.75);border-radius:999px;color:var(--gold);text-decoration:none;font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:background .25s ease,color .25s ease,transform .25s ease}
.contact-cta a:hover{background:var(--gold);color:#111116;transform:translateY(-2px)}
footer{text-align:center;color:#77736e;font-size:11px;letter-spacing:.12em;margin-top:30px}
